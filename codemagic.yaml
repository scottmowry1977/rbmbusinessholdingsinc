workflows:
  ios-testflight:
    name: RBM Holdings iOS TestFlight
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        BUNDLE_ID: "com.rbmbusinessholdingsinc.app"
      flutter: stable
      xcode: latest
      cocoapods: default
    integrations:
      app_store_connect: "RBM Connect"
    scripts:
      - name: Build and Sign
        script: |
          # 1. Initialize the Mac keychain
          keychain initialize
          
          # 2. Clear out any cached/conflicting profiles on the build machine
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*
          
          # 3. Fetch and create the signing files from Apple
          # We use --type IOS_APP_STORE as it is the standard for TestFlight
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          
          # 4. Add the certificates to the keychain
          keychain add-certificates
          
          # 5. Configure the project to use the new profiles
          xcode-project use-profiles
          
          # 6. Build the app
          flutter pub get
          # The key is to use the generated export options in the SAME script block
          flutter build ipa --release --export-options-plist=$CM_EXPORT_OPTIONS_PATH --build-number=$BUILD_NUMBER
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - "Testers"
