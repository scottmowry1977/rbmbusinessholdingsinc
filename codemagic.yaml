workflows:
  ios-testflight:
    name: RBM Holdings iOS TestFlight
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        BUNDLE_ID: "com.rbmbusinessholdingsinc.app"
      flutter: stable
      xcode: latest
      cocoapods: default
    integrations:
      app_store_connect: "RBM Connect"
    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type APPLE_DISTRIBUTION --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter pub get
          if [ -z "$CM_EXPORT_OPTIONS_PATH" ]; then
            echo "Error: CM_EXPORT_OPTIONS_PATH is not set. Code signing might have failed."
            exit 1
          fi
          flutter build ipa --release --export-options-plist=$CM_EXPORT_OPTIONS_PATH
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - "Testers"
