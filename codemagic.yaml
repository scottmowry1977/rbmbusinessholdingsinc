# Finalized build configuration
workflows:
  ios-testflight:
    name: RBM Holdings iOS TestFlight
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        BUNDLE_ID: "com.rbmbusinessholdingsinc.app"
      flutter: stable
      xcode: latest
      cocoapods: default
    integrations:
      app_store_connect: "RBM Connect"
    scripts:
      - name: Build and Sign
        script: |
          # 1. Initialize the Mac keychain
          keychain initialize
          
          # 2. Fetch and create the signing files from Apple
          # We use --type IOS_APP_STORE for TestFlight/App Store
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          
          # 3. Add the certificates to the keychain
          keychain add-certificates
          
          # 4. Configure the project to use the new profiles
          xcode-project use-profiles
          
          # 5. Build the app
          # Running everything in one block ensures $CM_EXPORT_OPTIONS_PATH is available
          flutter pub get
          flutter build ipa --release --export-options-plist=$CM_EXPORT_OPTIONS_PATH --build-number=$BUILD_NUMBER
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - "Testers"
